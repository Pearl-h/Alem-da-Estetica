<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="historia.css">
</head>
<body>

  <header>
    <div class="nav-links">
      <a href="/index.html">Início</a>
      <a href="/historia.html">História</a>
      <a href="/conteudos.html">Conteúdos</a>
      <a href="/contatos.html">Contatos</a>
    </div>
  </header>

<div class="timeline-container">
  <div class="timeline-line"></div>

  <div class="timeline-items">
    <div class="timeline-item">
      <div class="badge badge-top bg-blue">
        <span class="emoji">🧵</span>
      </div>
      <button class="node"
              data-id="1"
              data-tag="Final do séc. XIX"
              data-title="Nascimento da Alta-Costura e Belle Époque"
              data-img="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhhQ1BdiUI1l5ohbgYgjRFQ_Zrw8OCe99hx9hHoAFE5GX1Hb0MkAo9Ul-8D8ONL6-RO7VYuAt1sL3zQzivacSzHDBUWTlMcTz2Smkj2zBnjPFFx06eotatOjqhM1mzQhirGIm8p5gCTAX6m/s320/be011qp.jpg"
              data-text="A silhueta em 'S' e os espartilhos ornamentados definiram a opulência da aristocracia europeia antes de o mundo ruir com a guerra. A estética da época refletia a busca por status e refinamento, com ênfase em tecidos luxuosos e detalhes elaborados.">
        +
      </button>
      <div class="text-block text-block-bottom">
        <div class="year">Final do séc. XIX</div>
        <div class="description">Belle Époque e luxo aristocrático</div>
      </div>
    </div>

    
    <div class="timeline-item">
      <div class="text-block text-block-top">
        <div class="description">Liberdade e conforto no pós-guerra</div>
        <div class="year">Anos 1920</div>
      </div>
      <button class="node"
              data-id="2"
              data-tag="Anos 1920"
              data-title="Os Anos Loucos e a Era do Jazz"
              data-img="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgiRIMvOiW3-MmoTR1kKjccgWa0Gzyg_xcjzlVyVlaLSmBtVUEuEt1kY5gbY4naHYuvVEgbQaTubqquzoY8k0-FKqgCj87MdJOqinZ4qNjbx6dqHTIVVGD8Mgz31_asjakAB1iILxUcGjc5/s1600/1920s_flapper_in_chair..jpg"
              data-text="Coco Chanel popularizou o conforto, as calças femininas e o 'pretinho básico', refletindo a nova liberdade pós-Primeira Guerra. Mulheres abandonaram os espartilhos tradicionais, adotando cabelos curtos (bob cut) e vestidos retos de cintura baixa.">
        +
      </button>
      <div class="badge badge-bottom bg-cyan">
        <span class="emoji">👠</span>
      </div>
    </div>

    
    <div class="timeline-item">
      <div class="badge badge-top bg-yellow">
        <span class="emoji">🗼</span>
      </div>
      <button class="node"
              data-id="3"
              data-tag="1947"
              data-title="O 'New Look' de Christian Dior"
              data-img="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjwF2Eqneg5ijtJUDKlX8K-6ciX3id9qKQ_QT3Tk54WQJWTeKNq0Pj7OqXGOMJra27P127MGpziRW_KmO03KXHKHX4pZa7TBXZu4pLj0F_0Z8TE36hyyxxCHvXsYuG0Zehrhj5gXD2fjekH/s1600/Bar%2527+Suit+%2526+Hat+-+Christian+Dior1947.jpg"
              data-text="Lançado logo após as restrições de tecido da Segunda Guerra Mundial, o estilo trouxe cinturas bem marcadas e saias volumosas. Devolveu o glamour e o luxo à moda parisiense, consolidando Paris como o centro global da indústria fashion.">
        +
      </button>
      <div class="text-block text-block-bottom">
        <div class="year">1947</div>
        <div class="description">New Look e glamour parisiense</div>
      </div>
    </div>
    

    <div class="timeline-item">
      <div class="text-block text-block-top">
        <div class="description">Minissaia e juventude futurista</div>
        <div class="year">1960</div>
      </div>
      <button class="node"
              data-id="4"
              data-tag="1960"
              data-title="A Revolução dos Anos"
              data-img="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhhbGd77LMJiHhBmL14Fox1FwCFWWg02RWKSUPEY5Gn0ByGGGbcjq1cEs-PZoPh16PHj0K6rj50Wn1BD3dOrKphxh6eDyknTW8H2cyvNK3JFLZHSNIOQuhjr3SAPVNG6aj1TH_x-uiEFIy3/s1600/1960s-fashion-mini-dress.jpg​"
              data-text="Surgimento da minissaia com Mary Quant e a democratização da moda jovem e futurista, como os vestidos metálicos de Paco Rabanne. A rua passou a ditar tendências pela primeira vez, quebrando o elitismo da alta-costura tradicional.">
        +
      </button>
      <div class="badge badge-bottom bg-orange">
        <span class="emoji">💃</span>
      </div>
    </div>
    

    <div class="timeline-item">
      <div class="badge badge-top bg-pink">
        <span class="emoji">🤘</span>
      </div>
      <button class="node"
              data-id="5"
              data-tag="1970"
              data-title="Contracultura, Hippie e Punk"
              data-img="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiA5THeeKdqr-W_gEHSDQSKIdur9OP7eF3HGjCOBl1H1hCTlI-Y8KoKVz-p7aYTzwtkv9W8AlXXhPIUV-UUvfev0fN71f1aEdXSItsAG4Z3x8WwHyUtxJiFxgmPfLul_esG9_6zXdtS4VUk/s1600/roupas-anos-70.jpg"
              data-text="Coexistência de estilos contestadores, desde o visual fluido e artesanal do movimento hippie até o niilismo e o DIY (faça você mesmo) do punk. A roupa virou um manifesto político explícito de identidade, diversidade e ruptura com padrões conservadores.">
        +
      </button>
      <div class="text-block text-block-bottom">
        <div class="year">1970</div>
        <div class="description">Contracultura, punk e identidade</div>
      </div>
    </div>
  </div>
</div>

<div id="modalOverlay" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <span id="modalTag" class="modal-tag"></span>
    <img id="modal-img" src="" alt="Foto da época">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
  </div>
</div>

<script>
  const nodes = document.querySelectorAll('.node');
  const modalOverlay = document.getElementById('modalOverlay');
  const closeBtn = document.querySelector('.close-btn');

  const modalImg = document.getElementById('modal-img');
  const modalTitle = document.getElementById('modalTitle');
  const modalText = document.getElementById('modalText');
  const modalTag = document.getElementById('modalTag');

  nodes.forEach(node => {
    node.addEventListener('click', () => {
      modalImg.src = node.getAttribute('data-img');
      modalTag.textContent = node.getAttribute('data-tag');
      modalTitle.textContent = node.getAttribute('data-title');
      modalText.textContent = node.getAttribute('data-text');
      modalOverlay.classList.add('active');
    });
  });

  closeBtn.addEventListener('click', () => {
    modalOverlay.classList.remove('active');
  });

  window.addEventListener('click', (event) => {
    if (event.target === modalOverlay) {
      modalOverlay.classList.remove('active');
    }
  });
</script>

</body>
</html>
