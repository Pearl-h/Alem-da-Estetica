<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — Além da Estética</title>
  <style>
    body {
      background: #fff9fc;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 30px;
      color: #444;
    }
    .caixa-central {
      max-width: 850px;
      margin: 0 auto;
    }
    .painel {
      background: #fff;
      padding: 30px;
      border-radius: 18px;
      margin-bottom: 25px;
      border-left: 5px solid #dda0dd;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      text-align: center;
    }
    h2 { color: #8b668b; }
    p { color: #666; }
    button {
      background: #dda0dd;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 15px;
    }
    button:hover { background: #c896c8; }
    .opcoes {
      text-align: left;
      margin-top: 25px;
    }
    .opcoes button {
      display: block;
      width: 100%;
      padding: 12px 18px;
      margin: 10px 0;
      background: #f9f9f9;
      border-radius: 10px;
      border: none;
      border-left: 4px solid #98fb98;
      color: #444;
      text-align: left;
    }
    .opcoes button:hover {
      background: #f0f0ff;
      border-color: #dda0dd;
    }
  </style>
</head>
<body>
  <div class="caixa-central">
    <div id="quiz">
      <div id="startScreen" class="painel">
        <h2>Descubra seu Padrão 💜</h2>
        <p>Bem-vinda(o)! Não há respostas certas ou erradas 💡</p>
        <button id="startButton">Iniciar Quiz</button>
      </div>

      <div id="quizScreen" class="painel" style="display:none;">
        <h2 id="question"></h2>
        <div id="options" class="opcoes"></div>
        <button id="submit">Enviar</button>
      </div>
    </div>
  </div>

  <!-- ✅ CAMINHO CORRETO → o JS está dentro da pasta "Conteúdos"! -->
  <script src="Conteúdos/quiz.js"></script>
</body>
</html>
