<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz — Além da Estética</title>
  <style>
    body {
      background: #fff9fc;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 30px;
      color: #444;
    }
    .painel {
      background: #ffffff;
      padding: 30px;
      border-radius: 18px;
      margin: 0 auto;
      max-width: 850px;
      border-left: 5px solid #dda0dd;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
      text-align: center;
    }
    h2 { color: #8b668b; }
    p { color: #666; }
    button {
      background: #dda0dd;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 15px;
    }
    button:hover {
      background: #c896c8;
    }
    label {
      display: block;
      padding: 12px 18px;
      margin: 10px auto;
      max-width: 700px;
      background: #f9f9f9;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      border-left: 4px solid #98fb98;
      text-align: left;
    }
    label:hover {
      background: #f0f0ff;
      border-color: #dda0dd;
    }
  </style>
</head>
<body>
  <principal>
    <!-- TELA INICIAL — NÃO MEXI NOS ATRIBUTOS, SÓ ADICIONEI O ESTILO -->
    <eu ia="tela-inicial" class="painel">
      <h2>Descubra seu Padrão 💜</h2>
      <p>Bem-vindo ao quiz! Lembre-se, não há respostas erradas!</p>
      <p>Seja sincero para obter o melhor resultado 💡</p>
      <botao eu-ia="botao-inicial">Iniciar Quiz</botao>
    </eu>

    <!-- PERGUNTAS — MANTIVE TUDO IGUAL PARA FUNCIONAR -->
    <eu ia="tela-de-teste" class="painel" style="display:none;">
      <h2 eu-ia="pergunta"></h2>
      <div eu-ia="opcoes"></div>
      <botao eu-ia="enviar">Enviar</botao>
    </eu>
  </principal>

  <!-- ✅ O JS CONTINUA EXATAMENTE COMO ESTAVA — É ELE QUE FAZ FUNCIONAR -->
  <roteiro src="quiz.js"></roteiro>
</body>
</html>
