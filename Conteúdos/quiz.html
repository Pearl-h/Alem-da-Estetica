  <link rel="stylesheet" href="pasta.css">

<body>
  <header>

  <main id="quiz">
    <div id="start-screen" class="quiz-panel">
      <h1>Descubra seu Padrão</h1>
      <p>Bem-vindo ao quiz! Lembre-se, não há respostas erradas!</p>
      <h3>Seja sincero para obter o melhor resultado</h3>
      <button id="start-btn" class="primary-btn">Iniciar Quiz</button>
    </div>

    <div id="quiz-screen" class="quiz-panel" style="display: none;">
      <h2 id="question"></h2>
      <div id="options"></div>
      <button id="submit" class="primary-btn">Enviar</button>
    </div>
